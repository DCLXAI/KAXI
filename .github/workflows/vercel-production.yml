name: Vercel Production Release

run-name: >-
  Production ${{ inputs.operation }} · ${{ inputs.source_commit }} · ${{ inputs.ticket || 'read-only verification' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only schema verification or an approved production deployment
        required: true
        type: choice
        options:
          - verify
          - deploy
        default: verify
      source_commit:
        description: Exact 40-character main commit to verify or deploy
        required: true
        type: string
      deployment_authorized:
        description: Web and Railway production rollout is approved; ignored by verify
        required: true
        type: boolean
        default: false
      ticket:
        description: Approved change ticket (required for deploy)
        required: false
        type: string
      rollback_owner:
        description: Named rollback decision owner (required for deploy)
        required: false
        type: string
      base_url:
        description: Approved production/canary base URL
        required: false
        type: string
        default: https://kaxi.vercel.app
      baseline_complete_p95_ms:
        description: Approved pre-release completed-response p95 in milliseconds
        required: false
        type: string
      cold_first_progress_budget_ms:
        description: Approved cold first-progress budget in milliseconds
        required: false
        type: string
      alert_recipients_acknowledged:
        description: Alert recipients expect the production rehearsal
        required: true
        type: boolean
        default: false
      canary_start_utc:
        description: Exact UTC canary start (YYYY-MM-DDTHH:MM:SSZ)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kaxi-production
  cancel-in-progress: false

jobs:
  verify-release-ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify-release-ci]
    if: ${{ needs.verify-release-ci.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      # Pin the Vercel CLI. An upstream patch release previously broke the
      # prebuilt deployment path without a repository change.
      VERCEL_CLI_VERSION: "58.4.0"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      PRISMA_DATABASE_URL: ${{ secrets.PRISMA_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      KAXI_PRISMA_PROVIDER: postgresql
      EXPECTED_SHA: ${{ inputs.source_commit }}
      PRODUCTION_ENV_FILE: .vercel/.env.production.local
    steps:
      - name: Require explicit production deployment authorization
        if: ${{ inputs.operation == 'deploy' && !inputs.deployment_authorized }}
        run: |
          echo "deployment_authorized must be true for a production deployment."
          exit 1
      - name: Require Vercel deployment secrets
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo "VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are required."
          exit 1
      - name: Require production database secrets
        if: ${{ env.DATABASE_URL == '' && env.POSTGRES_URL == '' && env.PRISMA_DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL, POSTGRES_URL, or PRISMA_DATABASE_URL is required for production verification."
          exit 1
      - name: Mask production access secrets
        run: |
          [ -z "$DATABASE_URL" ] || echo "::add-mask::$DATABASE_URL"
          [ -z "$POSTGRES_URL" ] || echo "::add-mask::$POSTGRES_URL"
          [ -z "$PRISMA_DATABASE_URL" ] || echo "::add-mask::$PRISMA_DATABASE_URL"
          [ -z "$RAILWAY_TOKEN" ] || echo "::add-mask::$RAILWAY_TOKEN"
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify exact approved main commit
        run: |
          test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          test "${#EXPECTED_SHA}" = "40"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify reproducible release source
        run: bun run release:check:source -- --expected-sha "$EXPECTED_SHA"
      - name: Pull Vercel production environment
        run: bunx vercel@$VERCEL_CLI_VERSION pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify production database connectivity
        run: bun --env-file="$PRODUCTION_ENV_FILE" run db:check-production
      - name: Verify applied production schema
        if: ${{ inputs.operation == 'verify' }}
        run: bun --env-file="$PRODUCTION_ENV_FILE" run ops:check:schema-parity
      - name: Stop after read-only verification
        if: ${{ inputs.operation == 'verify' }}
        run: echo "PASS read-only production database and schema verification"
      - name: Run fail-closed production rollout preflight
        if: ${{ inputs.operation == 'deploy' }}
        env:
          CHANGE_TICKET: ${{ inputs.ticket }}
          ROLLBACK_OWNER: ${{ inputs.rollback_owner }}
          APPROVED_BASE_URL: ${{ inputs.base_url }}
          BASELINE_COMPLETE_P95_MS: ${{ inputs.baseline_complete_p95_ms }}
          COLD_FIRST_PROGRESS_BUDGET_MS: ${{ inputs.cold_first_progress_budget_ms }}
          CANARY_START_UTC: ${{ inputs.canary_start_utc }}
          ALERT_RECIPIENTS_ACKNOWLEDGED: ${{ inputs.alert_recipients_acknowledged }}
        run: |
          args=(
            --phase all
            --ticket "$CHANGE_TICKET"
            --rollback-owner "$ROLLBACK_OWNER"
            --source-commit "$EXPECTED_SHA"
            --railway-deploy-authorized
            --base-url "$APPROVED_BASE_URL"
            --baseline-complete-p95-ms "$BASELINE_COMPLETE_P95_MS"
            --cold-first-progress-budget-ms "$COLD_FIRST_PROGRESS_BUDGET_MS"
            --canary-start-utc "$CANARY_START_UTC"
          )
          if [ "$ALERT_RECIPIENTS_ACKNOWLEDGED" = "true" ]; then
            args+=(--alert-recipients-acknowledged)
          fi
          bun --env-file="$PRODUCTION_ENV_FILE" run ops:check:rollout-readiness -- "${args[@]}"
      - name: Check RAG serving projection drift
        if: ${{ inputs.operation == 'deploy' }}
        run: bun run rag:check:projection -- --base-url "${{ inputs.base_url }}"
      - name: Build with Vercel
        if: ${{ inputs.operation == 'deploy' }}
        run: bunx vercel@$VERCEL_CLI_VERSION build --prod --token="$VERCEL_TOKEN"
      - name: Apply PostgreSQL migrations
        if: ${{ inputs.operation == 'deploy' }}
        run: bun run scripts/deploy-postgres-migrations.ts
      - name: Verify post-migration schema parity
        if: ${{ inputs.operation == 'deploy' }}
        run: bun --env-file="$PRODUCTION_ENV_FILE" run ops:check:schema-parity
      - name: Prune deployment model cache
        if: ${{ inputs.operation == 'deploy' }}
        run: bun run scripts/prune-vercel-output.ts
      - name: Inject runtime environment into prebuilt functions
        if: ${{ inputs.operation == 'deploy' }}
        run: bun run scripts/inject-vercel-runtime-env.ts
      - name: Deploy production canary without assigning domains
        id: deploy
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          DEPLOYMENT_URL="$(bunx vercel@$VERCEL_CLI_VERSION deploy --prebuilt --archive=tgz --prod --skip-domain --meta "kaxiReleaseSha=$EXPECTED_SHA" --meta "kaxiSourceClean=1" --token="$VERCEL_TOKEN")"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
      - name: Verify production canary end to end
        if: ${{ inputs.operation == 'deploy' }}
        env:
          CANARY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          COOKIE_JAR="$RUNNER_TEMP/kaxi-vercel-bypass-cookie"
          bunx vercel@$VERCEL_CLI_VERSION curl /api/readiness --deployment "$CANARY_URL" -- \
            --silent --show-error \
            --cookie-jar "$COOKIE_JAR" \
            --header "x-vercel-set-bypass-cookie: true" \
            --output /dev/null
          bun run release:check:backend -- --base-url "$CANARY_URL" --cookie-file "$COOKIE_JAR"
      - name: Promote verified canary to production domains
        if: ${{ inputs.operation == 'deploy' }}
        run: bunx vercel@$VERCEL_CLI_VERSION promote "${{ steps.deploy.outputs.url }}" --yes --token="$VERCEL_TOKEN"
